name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack
        run: dotnet pack src/TensicAI.Sdk/TensicAI.Sdk.csproj -c Release -o artifacts

      - name: Authenticate to NuGet via trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jhe-tb

      - name: Push
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
